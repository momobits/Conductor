<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conductor — Control Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,700;1,9..144,900&family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>
  <header class="app-header">
    <div class="masthead">
      <div class="masthead-row">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">§</span>
          <span class="brand-name">Conductor</span>
          <span class="brand-italic">&nbsp;/ Control Room</span>
        </div>
        <div class="edition">
          <span class="edition-label">Edition</span>
          <span class="edition-value" id="edition-stamp">Vol. <span data-edition-vol>18</span> · N° <span data-edition-no>01</span></span>
        </div>
      </div>
      <div class="masthead-rule"></div>
      <div class="masthead-row meta-row">
        <nav class="app-nav" aria-label="Sections">
          <a href="#/board" data-nav="board"><span class="nav-num">01</span> <span class="nav-label">Board</span></a>
          <a href="#/monitor" data-nav="monitor"><span class="nav-num">02</span> <span class="nav-label">Monitor</span></a>
          <a href="#/routing" data-nav="routing"><span class="nav-num">03</span> <span class="nav-label">Routing</span></a>
        </nav>
        <div class="app-status" id="status" data-state="disconnected">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="status-label">disconnected</span>
        </div>
      </div>
    </div>
  </header>
  <main id="root" class="page">
    <div class="loading-shell">
      <span class="loading-mark">⌁</span>
      <span class="loading-text">Loading transmission…</span>
    </div>
  </main>
  <footer class="app-footer" aria-hidden="true">
    <span class="footer-glyph">◇</span>
    <span class="footer-text">End of transmission. Press <kbd>R</kbd> to re-tune.</span>
    <span class="footer-glyph">◇</span>
  </footer>
  <script type="module" src="/main.js"></script>
</body>
</html>
